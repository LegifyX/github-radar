services:
  github-radar:
    image: ghcr.io/legifyx/github-radar:latest
    # To build locally on TrueNAS Dockge instead of pulling from ghcr.io, uncomment below:
    # build: .
    container_name: github-radar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_PATH=/data/radar.db
      - BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=github_radar=info
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s