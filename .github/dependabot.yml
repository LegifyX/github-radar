version: 2

updates:
  # Keep GitHub Actions current: these are Node-based, so stale majors mean
  # running on a deprecated (and eventually unsupported) Node runtime.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Rust dependencies (also refreshes Cargo.lock). Every PR runs fmt, clippy,
  # tests and a non-pushing image build, so a broken bump fails before merge.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns:
          - "*"
