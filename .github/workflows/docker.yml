name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    # Docs-only pushes can't change the image. Path filters are not evaluated
    # for tag pushes, so `v*` releases always build.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # PRs build the image too (without pushing), so an action/dependency bump is
  # validated by a real image build before it can reach main.
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to the same branch/PR cancels the previous build. Never cancels
# a main build that may be mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only linux/amd64 is built on an amd64 runner, so QEMU emulation is not
      # needed. Add docker/setup-qemu-action here if arm64/armv7 is ever built.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR runs are build-only: no registry login, no push, no secrets.
      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
